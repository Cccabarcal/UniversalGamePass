# Nginx Configuration - Strangler Pattern Gateway
# Bifurca el tráfico entre Django (Legacy) y Flask (Microservicio de Reportes)

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging Format
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'upstream: $upstream_addr response_time: $upstream_response_time';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 20M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_types text/plain text/css text/xml text/javascript 
               application/x-javascript application/xml+rss 
               application/json application/javascript;

    # ====================================================================
    # Upstream Backends
    # ====================================================================

    # Django Monolito - Maneja la lógica principal del negocio
    upstream django_backend {
        server django_web:8000;
        keepalive 32;
    }

    # Flask Microservicio - Maneja reportes y análisis
    upstream reports_backend {
        server flask_reports:5000;
        keepalive 16;
    }

    # ====================================================================
    # Server Block - API Gateway
    # ====================================================================

    server {
        listen 80 default_server;
        listen [::]:80 default_server;

        server_name _;

        # ================================================================
        # Health Check Endpoint (para Nginx/Docker)
        # ================================================================
        location /health {
            access_log off;
            return 200 '{"status":"ok","service":"nginx-gateway"}\n';
            add_header Content-Type application/json;
        }

        # ================================================================
        # Strangler Pattern Routing
        # ================================================================

        # RUTA 1: /api/v2/reportes/* → Flask Microservicio (NEW)
        # Este es el tráfico "estrangulado" que fluye al nuevo servicio
        location ~ ^/api/v2/reportes/ {
            proxy_pass http://reports_backend;
            
            # Headers de proxy estándar
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            
            # Headers de conexión para mantener vivas
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            
            # Timeouts (los reportes pueden tomar más tiempo)
            proxy_connect_timeout 30s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            
            # No cachear respuestas de reportes
            proxy_cache off;
            
            # Logging
            access_log /var/log/nginx/access_reports.log main;
            
            # Manejo de errores
            error_page 502 503 504 /50x.html;
        }

        # RUTA 2: /api/v1/* → Django Monolito (Legacy)
        # Todas las rutas v1 siguen en Django
        location ~ ^/api/v1/ {
            proxy_pass http://django_backend;
            
            # Headers de proxy estándar
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            
            # Headers CSRF (Django lo requiere)
            proxy_set_header X-CSRFToken $http_x_csrftoken;
            
            # Mantener vivas las conexiones
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            
            # Timeouts estándar
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
            
            # Logging
            access_log /var/log/nginx/access_django.log main;
        }

        # RUTA 3: /* → Django Monolito (HTML/Templates/Admin)
        # Todas las otras rutas van al monolito (vistas HTML, admin, etc)
        location / {
            proxy_pass http://django_backend;
            
            # Headers de proxy estándar
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Headers para Django sessions
            proxy_set_header Cookie $http_cookie;
            proxy_set_header X-CSRFToken $http_x_csrftoken;
            
            # Mantener vivas las conexiones
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            
            # Timeouts estándar
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
            
            # Logging
            access_log /var/log/nginx/access.log main;
        }

        # ================================================================
        # Error Pages
        # ================================================================
        error_page 502 503 504 /50x.html;
        location /50x.html {
            root /usr/share/nginx/html;
            internal;
        }

        # ================================================================
        # Security Headers
        # ================================================================
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
    }
}
