version: '3.9'

services:
  # ======================================================================
  # Nginx - API Gateway / Reverse Proxy
  # ======================================================================
  nginx:
    image: nginx:alpine
    container_name: universalgamepass_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - django_web
      - flask_reports
    networks:
      - universalgamepass_network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # ======================================================================
  # Django Monolito (Legacy)
  # ======================================================================
  django_web:
    build:
      context: ./core
      dockerfile: Dockerfile
    container_name: universalgamepass_django
    command: gunicorn core.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 30
    volumes:
      - ./core:/app
      - ./core/db.sqlite3:/app/db.sqlite3
    environment:
      - DEBUG=False
      - DJANGO_DATABASE_URL=sqlite:////app/db.sqlite3
      - PYTHONUNBUFFERED=1
    networks:
      - universalgamepass_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # ======================================================================
  # Flask Microservicio - Reports Service (NEW)
  # ======================================================================
  flask_reports:
    build:
      context: ./reports_service
      dockerfile: Dockerfile
    container_name: universalgamepass_reports
    environment:
      - FLASK_APP=app.py
      - FLASK_ENV=production
      - FLASK_PORT=5000
      - PYTHONUNBUFFERED=1
    networks:
      - universalgamepass_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

networks:
  universalgamepass_network:
    driver: bridge

volumes:
  django_data:
    driver: local
