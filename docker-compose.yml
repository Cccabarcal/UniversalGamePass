version: '3.9'

services:
  # ======================================================================
  # Nginx - API Gateway / Reverse Proxy (Strangler Pattern)
  # ======================================================================
  nginx:
    image: nginx:alpine
    container_name: universalgamepass_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - django_web
      - flask_reports
    networks: [universalgamepass_network]
    restart: unless-stopped

  # ======================================================================
  # Django Monolito (Legacy)
  # ======================================================================
  django_web:
    build:
      context: ./core
      dockerfile: Dockerfile
    container_name: universalgamepass_django
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py seed_demo &&
             gunicorn core.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 30"
    volumes:
      - ./core:/app
    env_file: .env
    environment:
      - PYTHONUNBUFFERED=1
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    depends_on:
      - redis
    networks: [universalgamepass_network]
    restart: unless-stopped

  # ======================================================================
  # Flask Microservicio - Reports
  # ======================================================================
  flask_reports:
    build:
      context: ./reports_service
      dockerfile: Dockerfile
    container_name: universalgamepass_reports
    environment:
      - FLASK_APP=app.py
      - FLASK_PORT=5000
      - PYTHONUNBUFFERED=1
    networks: [universalgamepass_network]
    restart: unless-stopped

  # ======================================================================
  # Redis - Message Broker (Celery)
  # ======================================================================
  redis:
    image: redis:7-alpine
    container_name: universalgamepass_redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks: [universalgamepass_network]
    restart: unless-stopped

  # ======================================================================
  # Celery Worker - procesos asincronos
  # ======================================================================
  celery_worker:
    build:
      context: ./core
      dockerfile: Dockerfile
    container_name: universalgamepass_celery
    command: celery -A core worker --loglevel=info
    volumes:
      - ./core:/app
    env_file: .env
    environment:
      - PYTHONUNBUFFERED=1
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    depends_on:
      - redis
      - django_web
    networks: [universalgamepass_network]
    restart: unless-stopped

networks:
  universalgamepass_network:
    driver: bridge

volumes:
  redis_data:
    driver: local
